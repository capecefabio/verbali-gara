<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verbali GarApp</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <h1>Verbali GarApp</h1>

        <section class="header-settings" aria-label="Impostazioni gara">
            <div class="header-row">
                <div class="field">
                    <label for="tipo-globale">Tipo partecipanti:</label>
                    <select id="tipo-globale">
                        <option value="La ditta">Gara tra Aziende</option>
                        <option value="Il professionista">Gara tra Professionisti</option>
                    </select>
                </div>
                <div class="field">
                    <label for="computo-ufficio">Computo di Ufficio (€ Totale)</label>
                    <input type="number" id="computo-ufficio" min="0" step="0.01" placeholder="Importo IVA escl." inputmode="decimal">
                </div>
            </div>
        </section>

        <section id="offerte-list" aria-label="Offerte"></section>

        <button type="button" class="btn-generate" data-action="genera-verbale">Genera Verbale Finale</button>

        <section id="risultato-finale" class="hidden" aria-label="Verbale conclusivo">
            <h3>Verbale Conclusivo:</h3>
            <textarea id="output-testo-confronto" class="testo-finale" aria-label="Testo del verbale conclusivo"></textarea>
            <button type="button" class="copy-btn-main" data-action="copia-finale">Copia Verbale negli appunti</button>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
