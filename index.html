<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generatore Verbali Gara - V13</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f0f2f5; color: #1c1e21; padding: 20px; }
        .container { max-width: 900px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.1); }
        h1 { font-size: 26px; text-align: center; color: #007AFF; margin-bottom: 20px; }
        
        .header-settings { 
            background: linear-gradient(135deg, #007AFF, #0056b3); 
            color: white; padding: 25px; border-radius: 10px; margin-bottom: 25px; display: flex; flex-direction: column; gap: 15px; align-items: center;
        }
        .header-row { display: flex; gap: 20px; align-items: center; justify-content: center; flex-wrap: wrap; }
        .header-settings select, .header-settings input { padding: 10px; border-radius: 8px; border: none; font-size: 15px; }

        .offerta-box { border: 1px solid #e0e0e0; padding: 20px; border-radius: 10px; margin-bottom: 25px; background: #ffffff; }
        .badge { background: #e7f3ff; color: #007AFF; padding: 5px 12px; border-radius: 20px; font-size: 12px; font-weight: 700; margin-bottom: 15px; display: inline-block; }

        .row { display: flex; gap: 20px; margin-bottom: 15px; align-items: flex-end; flex-wrap: wrap; }
        .field { flex: 1; display: flex; flex-direction: column; min-width: 150px; }
        label { font-size: 11px; font-weight: 600; margin-bottom: 8px; color: #65676b; text-transform: uppercase; }
        
        input, select { padding: 12px; border: 1px solid #dddfe2; border-radius: 8px; font-size: 14px; }
        .calc-group { background: #f7f8fa; padding: 15px; border-radius: 8px; display: flex; gap: 15px; flex: 2; border: 1px dashed #ccd0d5; }
        .totale-field input { background-color: #e4e6eb; font-weight: 700; }

        .btn-group-singolo { display: flex; gap: 10px; align-items: center; margin-top: 10px; }
        .btn-small { padding: 10px 15px; background-color: #007AFF; color: white; border: none; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .btn-small:hover { background-color: #0056b3; }
        .btn-copy-mini { background-color: #28a745; }
        .btn-copy-mini:hover { background-color: #218838; }

        .output-singolo { width: 100%; height: 65px; padding: 10px; border-radius: 6px; border: 1px solid #ccedff; background-color: #f0f9ff; font-family: "Georgia", serif; font-size: 14px; resize: none; margin-top: 8px; box-sizing: border-box; }

        .btn-generate { width: 100%; padding: 16px; background-color: #1d1d1f; color: white; border: none; border-radius: 10px; font-size: 18px; font-weight: 600; cursor: pointer; margin-top: 20px; }
        .btn-generate:hover { background-color: #000; }

        #risultato-finale { margin-top: 35px; border-top: 2px solid #f0f2f5; padding-top: 25px; }
        .testo-finale { width: 100%; height: 400px; padding: 20px; border-radius: 10px; border: 1px solid #dddfe2; font-family: "Georgia", serif; line-height: 1.7; font-size: 16px; background: #fff; box-sizing: border-box; }
        .copy-btn-main { background-color: #28a745; margin-top: 15px; width: 100%; padding: 12px; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; }
    </style>
</head>
<body>

<div class="container">
    <h1>Verbali GarApp</h1>
    
    <div class="header-settings">
        <div class="header-row">
            <div class="field">
                <label style="color: white;">TIPO PARTECIPANTI:</label>
                <select id="tipo-globale" onchange="toggleInterfaccia()">
                    <option value="La ditta">Gara tra Aziende</option>
                    <option value="Il professionista">Gara tra Professionisti</option>
                </select>
            </div>
            <div class="field">
                <label style="color: white;">Computo di Ufficio (€ Totale)</label>
                <input type="number" id="computo-ufficio" step="0.01" placeholder="Importo IVA incl.">
            </div>
        </div>
    </div>

    <div id="offerte-list">
        <script>
            for(let i=1; i<=3; i++) {
                document.write(`
                <div class="offerta-box" id="box-${i}">
                    <span class="badge">Soggetto ${i}</span>
                    <div class="row">
                        <div class="field titolo-field" id="titolo-container-${i}" style="display:none; flex: 0 0 150px;">
                            <label>Titolo</label>
                            <select class="titolo">
                                <option value="L'Arch.">L'Arch.</option>
                                <option value="L'Ing.">L'Ing.</option>
                                <option value="Lo Studio">Lo Studio</option>
                            </select>
                        </div>
                        <div class="field">
                            <label>Nome / Ragione Sociale</label>
                            <input type="text" class="nome" placeholder="Inserire nome..." style="text-transform: uppercase;">
                        </div>
                    </div>
                    <div class="row">
                        <div class="field">
                            <label>Imponibile (€)</label>
                            <input type="number" step="0.01" class="imponibile" oninput="calcolaTotale(${i})" placeholder="0.00">
                        </div>
                        <div class="calc-group">
                            <div class="field" id="oneri-container-${i}" style="display:none;">
                                <label>Oneri (%)</label>
                                <input type="number" class="perc-oneri" value="4" oninput="calcolaTotale(${i})">
                            </div>
                            <div class="field">
                                <label>IVA (%)</label>
                                <input type="number" class="perc-iva" value="22" oninput="calcolaTotale(${i})">
                            </div>
                        </div>
                        <div class="field totale-field">
                            <label>Totale Calcolato (€)</label>
                            <input type="number" step="0.01" class="totale" readonly placeholder="0.00">
                        </div>
                    </div>
                    <div class="btn-group-singolo">
                        <button class="btn-small" onclick="generaSingola(${i})">Genera descrizione</button>
                        <button class="btn-small btn-copy-mini" onclick="copiaTesto('output-singolo-${i}')">Copia testo</button>
                    </div>
                    <textarea id="output-singolo-${i}" class="output-singolo" placeholder="La descrizione apparirà qui..." onclick="this.select()"></textarea>
                </div>
                `);
            }
        </script>
    </div>

    <button class="btn-generate" onclick="generaVerbale()">Genera Verbale Finale</button>

    <div id="risultato-finale" style="display:none;">
        <h3 style="color: #65676b; font-size: 14px; text-transform: uppercase;">Verbale Conclusivo:</h3>
        <textarea id="output-testo-confronto" class="testo-finale"></textarea>
        <button class="copy-btn-main" onclick="copiaTesto('output-testo-confronto')">Copia Verbale negli appunti</button>
    </div>
</div>

<script>
    function toggleInterfaccia() {
        const tipo = document.getElementById('tipo-globale').value;
        for (let i = 1; i <= 3; i++) {
            document.getElementById(`oneri-container-${i}`).style.display = (tipo === "Il professionista") ? 'flex' : 'none';
            document.getElementById(`titolo-container-${i}`).style.display = (tipo === "Il professionista") ? 'block' : 'none';
            calcolaTotale(i);
        }
    }

    function calcolaTotale(id) {
        const box = document.getElementById(`box-${id}`);
        const tipo = document.getElementById('tipo-globale').value;
        const imponibile = parseFloat(box.querySelector('.imponibile').value) || 0;
        const pIva = parseFloat(box.querySelector('.perc-iva').value) || 0;
        const totaleField = box.querySelector('.totale');

        if (tipo === "Il professionista") {
            const pOneri = parseFloat(box.querySelector('.perc-oneri').value) || 0;
            const oneri = imponibile * (pOneri / 100);
            const imponibilePiuOneri = imponibile + oneri;
            const iva = imponibilePiuOneri * (pIva / 100);
            totaleField.value = (imponibilePiuOneri + iva).toFixed(2);
        } else {
            const iva = imponibile * (pIva / 100);
            totaleField.value = (imponibile + iva).toFixed(2);
        }
    }

    function formatEuro(valore) {
        return new Intl.NumberFormat('it-IT', { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(valore);
    }

    function generaSingola(id) {
        const box = document.getElementById(`box-${id}`);
        const tipo = document.getElementById('tipo-globale').value;
        const nomeRaw = box.querySelector('.nome').value.trim() || `SOGGETTO ${id}`;
        const nomeCaps = nomeRaw.toUpperCase();
        const imponibile = parseFloat(box.querySelector('.imponibile').value) || 0;
        const totale = parseFloat(box.querySelector('.totale').value) || 0;

        let frase = "";
        if (tipo === "Il professionista") {
            const titolo = box.querySelector('.titolo').value;
            frase = `${titolo} ${nomeCaps} ha presentato regolare offerta per un importo di € ${formatEuro(imponibile)} + oneri professionali + iva pari a € ${formatEuro(totale)} iva compresa.`;
        } else {
            frase = `La ditta ${nomeCaps} ha presentato regolare offerta per un importo di € ${formatEuro(imponibile)} + iva pari a € ${formatEuro(totale)} iva compresa.`;
        }
        document.getElementById(`output-singolo-${id}`).value = frase;
    }

    function generaVerbale() {
        const tipoGlobale = document.getElementById('tipo-globale').value;
        const computoUfficio = parseFloat(document.getElementById('computo-ufficio').value) || 0;
        let dati = [];

        for(let i=1; i<=3; i++) {
            const b = document.getElementById(`box-${i}`);
            let nomeRaw = b.querySelector('.nome').value.trim();
            if(nomeRaw === "") continue;

            let titoloVal = (tipoGlobale === "Il professionista") ? b.querySelector('.titolo').value : "La ditta";
            let nomeCaps = nomeRaw.toUpperCase();
            let imponibile = parseFloat(b.querySelector('.imponibile').value) || 0;
            let totale = parseFloat(b.querySelector('.totale').value) || 0;

            dati.push({ titolo: titoloVal, nomeCaps, imponibile, totale });
        }

        if(dati.length < 2) { alert("Inserisci almeno 2 soggetti."); return; }
        if(computoUfficio <= 0) { alert("Inserisci il valore del computo di ufficio."); return; }

        dati.sort((a, b) => a.imponibile - b.imponibile);
        let m1 = dati[0], m2 = dati[1];
        let scostamento = ((m2.imponibile - m1.imponibile) / m1.imponibile) * 100;
        
        let testo = "";
        let suff_iva = (tipoGlobale === "Il professionista" ? "+ oneri professionali + iva" : "+ iva");

        if (scostamento > 5) {
            let soggettoVincitore = (tipoGlobale === "Il professionista") ? `${m1.titolo} ${m1.nomeCaps}` : `della ditta ${m1.nomeCaps}`;
            testo = `Esaminate tutte le offerte la miglior offerta è risultata essere quella ${soggettoVincitore} che ha presentato offerta per un importo di € ${formatEuro(m1.imponibile)} ${suff_iva} pari a € ${formatEuro(m1.totale)} iva compresa.\n`;
            testo += `la restante documentazione allegata è regolarmente timbrata e firmata.\n`;
            let secondoSoggetto = (tipoGlobale === "Il professionista") ? `${m2.titolo} ${m2.nomeCaps}` : `ditta ${m2.nomeCaps}`;
            testo += `avendo la seconda offerta (${secondoSoggetto} offerta per un importo di € ${formatEuro(m2.imponibile)} ${suff_iva} pari a € ${formatEuro(m2.totale)} iva compresa.) uno scostamento superiore al 5% rispetto alla migliore offerta non si ritiene di dover procedere ad una richiesta di riallineamento.\n`;
        } else {
            let miglioriOfferte = (tipoGlobale === "Il professionista") ? `dell'${m1.titolo} ${m1.nomeCaps} e quella dell'${m2.titolo} ${m2.nomeCaps}` : `della ditta ${m1.nomeCaps} e quella della ditta ${m2.nomeCaps}`;
            testo = `Esaminate tutte le offerte le migliori offerte risultano essere quelle ${miglioriOfferte} che hanno presentato le seguenti offerte:\n`;
            let d1 = (tipoGlobale === "Il professionista") ? `${m1.titolo} ${m1.nomeCaps}` : `La ditta ${m1.nomeCaps}`;
            let d2 = (tipoGlobale === "Il professionista") ? `${m2.titolo} ${m2.nomeCaps}` : `La ditta ${m2.nomeCaps}`;
            testo += `${d1} ha presentato offerta per un importo di € ${formatEuro(m1.imponibile)} ${suff_iva} pari a € ${formatEuro(m1.totale)} iva compresa.\n`;
            testo += `${d2} ha presentato offerta per un importo di € ${formatEuro(m2.imponibile)} ${suff_iva} pari a € ${formatEuro(m2.totale)} iva compresa.\n`;
            testo += `la restante documentazione allegata è regolarmente timbrata e firmata.\n`;
            testo += `avendo le due offerte uno scostamento inferiore al 5% (pari al ${scostamento.toFixed(2)}%) si ritiene di dover procedere ad una richiesta di riallineamento.\n`;
            if (dati[2]) {
                let m3 = dati[2];
                let d3 = (tipoGlobale === "Il professionista") ? `L'offerta dell'${m3.titolo} ${m3.nomeCaps}` : `L'offerta della ditta ${m3.nomeCaps}`;
                testo += `${d3} ha presentato offerta per un importo di € ${formatEuro(m3.imponibile)} ${suff_iva} pari a € ${formatEuro(m3.totale)} iva compresa risulta essere superiore del 5% rispetto alle migliori offerte presentate, pertanto non si ritiene di richiedere al soggetto stesso un riallineamento.\n`;
            }
        }

        let ribassoSuComputo = ((computoUfficio - m1.totale) / computoUfficio) * 100;
        testo += `Si segnala che la miglior offerta presenta uno scostamento di circa il ${Math.round(ribassoSuComputo)}% in meno rispetto al computo di ufficio pari a € ${formatEuro(computoUfficio)} iva e oneri compresi.\n`;
        
        if (scostamento > 5) {
            let assegnatario = (tipoGlobale === "Il professionista") ? `${m1.titolo} ${m1.nomeCaps}` : `alla ditta ${m1.nomeCaps}`;
            testo += `Si ritiene pertanto opportuno di assegnare l'attività ${assegnatario} che ha presentato offerta per un importo di € ${formatEuro(m1.imponibile)} ${suff_iva} pari a € ${formatEuro(m1.totale)} iva compresa.`;
        }

        document.getElementById('output-testo-confronto').value = testo;
        document.getElementById('risultato-finale').style.display = 'block';
        window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
    }

    function copiaTesto(id) {
        const el = document.getElementById(id);
        if(!el.value) return;
        el.select();
        document.execCommand("copy");
        
        // Semplice feedback visivo
        const originalText = "Copiato!";
        console.log("Testo copiato negli appunti");
        alert("Copiato!");
    }
</script>

</body>
</html>
